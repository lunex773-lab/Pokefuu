<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Phantom" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Project Phantom</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; background: #05040a; color: #ece6f2; font: 20px sans-serif; z-index: 20; text-align: center; padding: 24px; }
      #rotate span { font-size: 56px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><span>⟳</span>端末を横向きにしてください<br /><small>（iPhone は横向き専用です。ホーム画面に追加すると全画面で遊べます）</small></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
